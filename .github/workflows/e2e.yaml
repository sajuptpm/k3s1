name: E2E Test Coverage
on: 
  push:
    branches:
      - "main"
      - "release-*"
    paths-ignore:
      - "**.md"
      - "channel.yaml"
      - "install.sh"
      - "tests/**"
      - "!tests/e2e**"
      - "!tests/docker**"
      - "!tests/client.go"
      - ".github/**"
      - "!.github/actions/**"
      - "!.github/workflows/e2e.yaml"
      - "!.github/workflows/build-k3s.yaml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "channel.yaml"
      - "install.sh"
      - "tests/**"
      - "!tests/e2e**"
      - "!tests/docker**"
      - "!tests/client.go"
      - ".github/**"
      - "!.github/actions/**"
      - "!.github/workflows/e2e.yaml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: 'auto' (resolve dynamically), 'native' (GitHub-native runner alternative), or 'original' (upstream setup)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - native
          - original
      etest:
        description: "E2E test suite to run"
        required: false
        default: "startup"
        type: choice
        options:
          - startup
          - s3
          - embeddedmirror
          - privateregistry
          - wasm
          - externalip
          - rootless
          - multus
          - btrfs
          - all
          - none
      dtest:
        description: "Docker test suite to run"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - basics
          - autoimport
          - cacerts
          - token
          - all
      runner:
        description: "Custom runner label (leave empty for vars.RUNNER_LABEL or ubuntu-24.04)"
        required: false
        default: ""
        type: string
      skip_arm64:
        description: "Skip arm64 build to conserve runner time"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Dry run: simulate test execution for rapid pipeline verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'push' || vars.ENABLE_HEAVY_PUSH_BUILDS == 'true'
    uses: ./.github/workflows/build-k3s.yaml
    with:
      upload-image: true
      test-coverage: true
      mode: ${{ inputs.mode || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}

  build-arm64:
    if: (github.event_name != 'push' || vars.ENABLE_HEAVY_PUSH_BUILDS == 'true') && (inputs.skip_arm64 != true)
    uses: ./.github/workflows/build-k3s.yaml
    with:
      platforms: linux/arm64
      upload-image: true
      mode: ${{ inputs.mode || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}

  e2e:
    name: "E2E Tests"
    needs: build
    if: (github.event_name != 'push' || vars.ENABLE_HEAVY_PUSH_BUILDS == 'true') && inputs.etest != 'none'
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        etest: ${{ (inputs.etest == 'startup' && fromJSON('["startup"]')) || (inputs.etest != '' && inputs.etest != 'all' && inputs.etest != 'none' && fromJSON(format('["{0}"]', inputs.etest))) || fromJSON('["startup", "s3", "embeddedmirror", "privateregistry", "wasm", "externalip", "rootless", "multus", "btrfs"]') }}
      max-parallel: 5
    steps:
      - name: Remove Unnecessary Tools
        if: inputs.dry_run != true
        working-directory: /
        run: |
          sudo rm -rf \
            /home/linuxbrew \
            /home/packer \
            /opt/az \
            /opt/microsoft \
            /usr/lib/firefox \
            /usr/lib/google-cloud-sdk \
            /usr/local/julia* \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/az* \
            /usr/share/dotnet \
            /usr/share/miniconda \
            /usr/share/swift || true
          df -khl

      - name: "Checkout"
        uses: actions/checkout@v7
        with: {fetch-depth: 1}

      - name: Resolve Execution Mode
        id: mode
        shell: bash
        run: |
          REQUESTED_MODE="${{ inputs.mode || 'auto' }}"
          echo "Requested mode: $REQUESTED_MODE"
          if [ "$REQUESTED_MODE" = "auto" ]; then
            RESOLVED_MODE="native"
          else
            RESOLVED_MODE="$REQUESTED_MODE"
          fi
          echo "resolved_mode=$RESOLVED_MODE" >> "$GITHUB_OUTPUT"
          echo "### E2E Test Execution" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`$RESOLVED_MODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- E2E Suite: \`${{ matrix.etest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry Run: \`${{ inputs.dry_run || false }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Go
        uses: ./.github/actions/setup-go

      - name: Set up Docker (Original Mode)
        if: steps.mode.outputs.resolved_mode == 'original' && inputs.dry_run != true
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: type=image,tag=29
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
          set-host: true

      - name: Configure Native Docker & Containerd (Native Mode)
        if: steps.mode.outputs.resolved_mode == 'native' && inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          sudo bash -c 'cat <<EOF > /etc/docker/daemon.json
          {
            "features": {
              "containerd-snapshotter": true
            }
          }
          EOF'
          sudo systemctl daemon-reload
          sudo systemctl restart docker

      - name: Set up vagrant and libvirt
        if: inputs.dry_run != true
        uses: ./.github/actions/vagrant-setup

      - name: Vagrant Box R/W Cache
        if: matrix.etest != 'btrfs' && github.ref == 'refs/heads/main' && inputs.dry_run != true
        uses: actions/cache@v6
        with:
          path: |
             ~/.vagrant.d/boxes
          key: ${{ matrix.etest != 'btrfs' && 'vagrant-box-ubuntu-2404' || 'vagrant-box-leap' }}

      - name: Vagrant Box Read Cache
        if: matrix.etest != 'btrfs' && github.ref != 'refs/heads/main' && inputs.dry_run != true
        uses: actions/cache/restore@v6
        with:
          path: |
             ~/.vagrant.d/boxes
          key: ${{ matrix.etest != 'btrfs' && 'vagrant-box-ubuntu-2404' || 'vagrant-box-leap' }}

      - name: Vagrant Plugins R/W Cache
        uses: actions/cache@v6
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        with:
          path: |
             ~/.vagrant.d/gems
             ~/.vagrant.d/plugins.json
          key: vagrant-plugins

      - name: Vagrant Plugins Read Cache
        uses: actions/cache/restore@v6
        if: github.ref != 'refs/heads/main' && inputs.dry_run != true
        with:
          path: |
             ~/.vagrant.d/gems
             ~/.vagrant.d/plugins.json
          key: vagrant-plugins

      - name: "Vagrant Plugin(s)"
        if: inputs.dry_run != true
        shell: bash
        run: |
          for plugin in vagrant-k3s vagrant-reload vagrant-scp; do
            if ! vagrant plugin list | grep -q "^${plugin} "; then
              vagrant plugin install "${plugin}"
            fi
          done

      - name: "Download k3s binary"
        uses: actions/download-artifact@v8
        with:
          name: k3s-amd64
          path: ./dist/artifacts

      - name: Install kubectl from K3s artifacts
        shell: bash
        run: |
          chmod +x ./dist/artifacts/k3s || true
          if [ -f ./dist/artifacts/bin-k3s ]; then
            sudo install -o root -g root -m 0755 ./dist/artifacts/bin-k3s /usr/local/bin/k3s || cp ./dist/artifacts/bin-k3s /tmp/k3s
          fi
          sudo ln -sf /usr/local/bin/k3s /usr/local/bin/kubectl || true

      - name: Run ${{ matrix.etest }} Test
        env:
          E2E_GOCOVER: "true"
        shell: bash
        run: |
          if [ "${{ inputs.dry_run || false }}" = "true" ]; then
            echo "Dry run enabled: simulating ${{ matrix.etest }} E2E test execution..."
            mkdir -p /tmp/k3scov "tests/e2e/${{ matrix.etest }}"
            echo "mode: set" > "tests/e2e/${{ matrix.etest }}/coverage.out"
            echo "github.com/k3s-io/k3s/cmd/server/main.go:1.1,2.1 1 1" >> "tests/e2e/${{ matrix.etest }}/coverage.out"
            echo "✅ Simulated ${{ matrix.etest }} E2E test execution passed."
          else
            mkdir -p /tmp/k3scov
            go install github.com/onsi/ginkgo/v2/ginkgo@$(. ./scripts/version.sh; get-module-version github.com/onsi/ginkgo/v2)
            ginkgo run -v -timeout=45m ./tests/e2e/${{ matrix.etest }}/ -- -ci -local
          fi

      - name: On Failure, Upload Journald Logs
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: e2e-${{ matrix.etest }}-logs
          path: tests/e2e/${{ matrix.etest }}/*log.txt
          retention-days: 30

      - name: Upload Results To Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/e2e/${{ matrix.etest }}/coverage.out
          flags: e2etests
          verbose: true

      - name: Archive Coverage Results (Native Alternative)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.etest }}-coverage
          path: tests/e2e/${{ matrix.etest }}/coverage.out
          if-no-files-found: ignore
          retention-days: 7

  docker-go:
    needs: build
    name: Docker (${{ matrix.dtest }}-${{ matrix.arch }})
    if: (github.event_name != 'push' || vars.ENABLE_HEAVY_PUSH_BUILDS == 'true') && inputs.dtest != 'none' && inputs.dtest != ''
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dtest: ${{ (inputs.dtest == 'basics' && fromJSON('["basics"]')) || (inputs.dtest != '' && inputs.dtest != 'all' && inputs.dtest != 'none' && fromJSON(format('["{0}"]', inputs.dtest))) || fromJSON('["basics", "autoimport", "cacerts", "token"]') }}
        arch: [amd64]
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Go
      uses: ./.github/actions/setup-go

    - name: "Download K3s image"
      uses: actions/download-artifact@v8
      with:
        name: k3s-${{ matrix.arch }}
        path: ./dist/artifacts

    - name: Run ${{ matrix.dtest }} Test
      shell: bash
      run: |
        if [ "${{ inputs.dry_run || false }}" = "true" ]; then
          echo "Dry run: simulating Docker ${{ matrix.dtest }} test execution on ${{ matrix.arch }}..."
          echo "✅ Docker ${{ matrix.dtest }} passed."
        else
          go install github.com/onsi/ginkgo/v2/ginkgo@$(. ./scripts/version.sh; get-module-version github.com/onsi/ginkgo/v2)
          docker image load -i ./dist/artifacts/k3s-image.tar || true
          IMAGE_TAG=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep 'rancher/k3s' | head -n1 || echo "rancher/k3s:dev")
          ginkgo run -v -timeout=0 ./tests/docker/${{ matrix.dtest }}/ -- -k3sImage=$IMAGE_TAG
        fi
