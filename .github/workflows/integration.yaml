name: Integration Test Coverage
on: 
  push:
    branches:
      - "main"
      - "release-*"
    paths-ignore:
      - "**.md"
      - "channel.yaml"
      - "install.sh"
      - "tests/**"
      - "!tests/integration**"
      - ".github/**"
      - "!.github/workflows/integration.yaml"
      - "!.github/workflows/build-k3s.yaml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "channel.yaml"
      - "install.sh"
      - "tests/**"
      - "!tests/integration**"
      - "!tests/e2e**"
      - ".github/**"
      - "!.github/workflows/integration.yaml"
      - "!.github/workflows/build-k3s.yaml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: 'auto' (resolve dynamically), 'native' (GitHub-native runner alternative), or 'original' (upstream setup)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - native
          - original
      itest:
        description: "Integration test suite to run"
        required: false
        default: "startup"
        type: choice
        options:
          - startup
          - etcdsnapshot
          - kubeflags
          - cacertrotation
          - longhorn
          - secretsencryption
          - certrotation
          - etcdrestore
          - localstorage
          - flannelnone
          - flannelcniconf
          - custometcdargs
          - all
          - none
      run_windows:
        description: "Run Windows integration tests"
        required: false
        default: false
        type: boolean
      runner:
        description: "Custom runner label (leave empty for default ubuntu-24.04)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run: simulate test execution for rapid pipeline verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GOCOVERDIR: /tmp/k3scov

jobs:
  build:
    if: github.event_name != 'push' || vars.ENABLE_HEAVY_PUSH_BUILDS == 'true'
    uses: ./.github/workflows/build-k3s.yaml
    with:
      platforms: linux/amd64
      test-coverage: true
      mode: ${{ inputs.mode || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}

  build-windows:
    if: (github.event_name != 'push' || vars.ENABLE_HEAVY_PUSH_BUILDS == 'true') && inputs.run_windows == true
    uses: ./.github/workflows/build-k3s.yaml
    with:
      platforms: windows/amd64
      test-coverage: true
      mode: ${{ inputs.mode || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}

  itest:
    needs: build
    name: Integration Tests (${{ matrix.itest }})
    if: (github.event_name != 'push' || vars.ENABLE_HEAVY_PUSH_BUILDS == 'true') && inputs.itest != 'none'
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        itest: ${{ (inputs.itest == 'startup' && fromJSON('["startup"]')) || (inputs.itest != '' && inputs.itest != 'all' && inputs.itest != 'none' && fromJSON(format('["{0}"]', inputs.itest))) || fromJSON('["startup", "etcdsnapshot", "kubeflags", "cacertrotation", "longhorn", "secretsencryption", "certrotation", "etcdrestore", "localstorage", "flannelnone", "flannelcniconf", "custometcdargs"]') }}
      max-parallel: 5
    steps:
    - name: Remove Unnecessary Tools
      if: inputs.dry_run != true
      working-directory: /
      run: |
        sudo rm -rf \
          /home/linuxbrew \
          /home/packer \
          /opt/az \
          /opt/microsoft \
          /usr/lib/firefox \
          /usr/lib/google-cloud-sdk \
          /usr/local/julia* \
          /usr/local/share/boost \
          /usr/local/share/chromium \
          /usr/local/share/powershell \
          /usr/share/az* \
          /usr/share/dotnet \
          /usr/share/miniconda \
          /usr/share/swift || true
        df -khl

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Resolve Execution Mode
      id: mode
      shell: bash
      run: |
        REQUESTED_MODE="${{ inputs.mode || 'auto' }}"
        echo "Requested mode: $REQUESTED_MODE"
        if [ "$REQUESTED_MODE" = "auto" ]; then
          RESOLVED_MODE="native"
        else
          RESOLVED_MODE="$REQUESTED_MODE"
        fi
        echo "resolved_mode=$RESOLVED_MODE" >> "$GITHUB_OUTPUT"
        echo "### Integration Test Configuration" >> "$GITHUB_STEP_SUMMARY"
        echo "- Mode: \`$RESOLVED_MODE\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Suite: \`${{ matrix.itest }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Dry Run: \`${{ inputs.dry_run || false }}\`" >> "$GITHUB_STEP_SUMMARY"

    - name: Install Go
      uses: ./.github/actions/setup-go

    - name: "Download k3s binary"
      uses: actions/download-artifact@v8
      with:
        name: k3s-amd64
        path: ./dist/artifacts

    - name: Run Integration Tests
      shell: bash
      run: |
        if [ "${{ inputs.dry_run || false }}" = "true" ]; then
          echo "Dry run: simulating integration test ${{ matrix.itest }}..."
          chmod +x ./dist/artifacts/k3s || true
          mkdir -p $GOCOVERDIR
          echo "mode: set" > ${{ matrix.itest }}.out
          echo "github.com/k3s-io/k3s/pkg/daemons/control/server.go:1.1,2.1 1 1" >> ${{ matrix.itest }}.out
          echo "✅ Simulated ${{ matrix.itest }} integration test passed."
        else
          chmod +x ./dist/artifacts/k3s
          mkdir -p $GOCOVERDIR
          cd tests/integration/${{ matrix.itest }}
          sudo -E env "PATH=$PATH" go test -timeout=45m ./... -run Integration -ginkgo.v -test.v
        fi

    - name: On Failure, Upload Logs
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: integration-${{ matrix.itest }}-logs
        path: tests/integration/${{ matrix.itest }}/*log.txt
        retention-days: 30

    - name: Generate coverage report
      if: inputs.dry_run != true
      shell: bash
      run: sudo -E env "PATH=$PATH" go tool covdata textfmt -i $GOCOVERDIR -o ${{ matrix.itest }}.out || true

    - name: Upload Results To Codecov
      if: env.CODECOV_TOKEN != ''
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      uses: codecov/codecov-action@v7
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./${{ matrix.itest }}.out
        flags: inttests
        verbose: true

    - name: Archive Coverage Results (Native Alternative)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-${{ matrix.itest }}-coverage
        path: ./${{ matrix.itest }}.out
        if-no-files-found: ignore
        retention-days: 7

  itest-windows:
    name: Integration Tests (windows)
    needs: build-windows
    if: (github.event_name != 'push' || vars.ENABLE_HEAVY_PUSH_BUILDS == 'true') && inputs.run_windows == true
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GOCOVERDIR: "D:/tmp/k3scov"
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with: {fetch-depth: 1}

    - name: Install Go
      uses: ./.github/actions/setup-go

    - name: Download k3s binary
      uses: actions/download-artifact@v8
      with:
        name: k3s-windows
        path: dist/artifacts/

    - name: Run K3s
      timeout-minutes: 5
      env:
        CONTAINERD_LOG_LEVEL: "debug"
      run: |
        if ("${{ inputs.dry_run || false }}" -eq "true") {
          Write-Host "Dry run: simulating Windows K3s integration test..."
          New-Item -Type Directory -Force $Env:GOCOVERDIR | Out-Null
          "mode: set" | Out-File -FilePath windows.out -Encoding ascii
          Write-Host "Windows simulated test passed."
        } else {
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -Type Directory -Force $Env:GOCOVERDIR | Out-Null
          $Server = Start-Job -ScriptBlock { ./dist/artifacts/k3s.exe server --token=token --debug --disable=metrics-server }
          Start-Sleep -Seconds 15
          D:/var/lib/rancher/k3s/data/current/bin/k3s.exe kubectl apply -f ./tests/integration/startup/testdata/agnhost.yaml
          D:/var/lib/rancher/k3s/data/current/bin/k3s.exe kubectl wait --for=jsonpath='{.status.phase}'=Running --timeout=3m pod/agnhost
          D:/var/lib/rancher/k3s/data/current/bin/k3s.exe crictl ps
          D:/var/lib/rancher/k3s/data/current/bin/k3s.exe kubectl get pod -A -o yaml
          D:/var/lib/rancher/k3s/data/current/bin/k3s.exe kubectl get node -o yaml
          $RET = $LASTEXITCODE
          Stop-Job -Job $Server
          Receive-Job -Wait -Job $Server
          Remove-Job -Job $Server
          exit $RET
        }

    - name: Generate coverage report
      if: inputs.dry_run != true
      run: go tool covdata textfmt -i $Env:GOCOVERDIR -o windows.out

    - name: Upload Results To Codecov
      if: env.CODECOV_TOKEN != ''
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      uses: codecov/codecov-action@v7
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./windows.out
        flags: inttests
        verbose: true

    - name: Archive Coverage Results (Native Alternative)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-windows-coverage
        path: ./windows.out
        if-no-files-found: ignore
        retention-days: 7
