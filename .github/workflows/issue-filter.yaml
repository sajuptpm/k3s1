name: Issue Filter

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: 'auto' (resolve dynamically), 'native' (safe inspector with summary), or 'original' (strict close)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - native
          - original
      issue_number:
        description: "Issue number to evaluate (leave empty to scan latest open issue)"
        required: false
        default: ""
        type: string
      max_length:
        description: "Maximum allowed issue body length without template"
        required: false
        default: "2000"
        type: string
      dry_run:
        description: "Dry run: simulate check without closing issue"
        required: false
        default: true
        type: boolean
      runner:
        description: "Custom runner label (leave empty for default ubuntu-24.04)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  close-oversized-issues:
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve Execution Mode
        id: mode
        shell: bash
        run: |
          REQUESTED_MODE="${{ inputs.mode || 'auto' }}"
          echo "Requested mode: $REQUESTED_MODE"
          if [ "$REQUESTED_MODE" = "auto" ]; then
            RESOLVED_MODE="native"
          else
            RESOLVED_MODE="$REQUESTED_MODE"
          fi
          echo "resolved_mode=$RESOLVED_MODE" >> "$GITHUB_OUTPUT"
          echo "### Issue Filter Execution" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`$RESOLVED_MODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry Run: \`${{ inputs.dry_run || (github.event_name == 'workflow_dispatch') }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check issue size and type (Native Alternative)
        if: steps.mode.outputs.resolved_mode == 'native'
        id: issue-check-native
        uses: actions/github-script@v9
        with:
          script: |
            let issue = context.payload.issue;
            const inputIssueNum = context.payload.inputs?.issue_number;
            const maxLength = parseInt(context.payload.inputs?.max_length || '2000', 10);
            
            if (!issue && inputIssueNum) {
              core.info(`Fetching specified issue #${inputIssueNum}...`);
              const res = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(inputIssueNum, 10)
              }).catch(err => {
                core.warning(`Failed to fetch issue #${inputIssueNum}: ${err.message}`);
                return null;
              });
              if (res) issue = res.data;
            }

            if (!issue) {
              core.info('No event issue found. Searching for latest repository issue for demonstration...');
              const { data: openIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 1
              }).catch(() => ({ data: [] }));
              if (openIssues.length > 0) {
                issue = openIssues[0];
              }
            }

            if (!issue) {
              core.info('No issues exist in repository to evaluate. Creating mock issue context for verification.');
              issue = {
                number: 9999,
                title: 'Mock Issue Verification',
                body: 'Small test issue template body.',
                user: { login: context.actor },
                type: 'Bug'
              };
            }

            const bodyLength = (issue.body || '').length;
            const hasType = Boolean(issue.type);
            const isOversized = bodyLength > maxLength;
            
            let isMaintainer = false;
            try {
              const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: issue.user.login,
              });
              isMaintainer = permission === 'maintain' || permission === 'admin';
            } catch (err) {
              core.info(`Could not get collaborator permission for ${issue.user.login}: ${err.message}`);
              isMaintainer = (issue.user.login === context.repo.owner);
            }

            const shouldClose = isOversized && !hasType && !isMaintainer;
            core.setOutput('should-close', shouldClose ? 'true' : 'false');
            core.setOutput('target-issue-number', issue.number);

            let summary = `### 🔍 Issue Filter Analysis for #${issue.number}\n\n`;
            summary += `- **Title**: ${issue.title}\n`;
            summary += `- **Author**: \`@${issue.user.login}\` (Maintainer: \`${isMaintainer}\`)\n`;
            summary += `- **Body Character Length**: ${bodyLength} / ${maxLength} maximum\n`;
            summary += `- **Has Issue Type**: \`${hasType}\`\n`;
            summary += `- **Action Decision**: ${shouldClose ? '🛑 Flagged for closure' : '✅ Compliant (Keep open)'}\n`;
            await core.summary.addRaw(summary).write();

      - name: Check issue size and type (Original Mode)
        if: steps.mode.outputs.resolved_mode == 'original'
        id: issue-check-original
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              core.warning('No issue found in payload.');
              core.setOutput('should-close', 'false');
              return;
            }
            const hasType = Boolean(issue.type);
            const isOversized = (issue.body || '').length > 2000;
            const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: issue.user.login,
            });
            const isMaintainer = permission === 'maintain' || permission === 'admin';
            core.setOutput('should-close', isOversized && !hasType && !isMaintainer);
            core.setOutput('target-issue-number', issue.number);

      - name: Close oversized issue
        if: (steps.issue-check-native.outputs.should-close == 'true' || steps.issue-check-original.outputs.should-close == 'true') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TARGET_ISSUE="${{ steps.issue-check-native.outputs.target-issue-number || steps.issue-check-original.outputs.target-issue-number || github.event.issue.number }}"
          echo "Closing oversized issue #$TARGET_ISSUE..."
          gh issue close "$TARGET_ISSUE" \
            --comment "Large Untemplated Issue Detected. Please resubmit using one of our issue templates."
