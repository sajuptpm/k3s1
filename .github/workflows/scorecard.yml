name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '25 12 * * 5'
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: 'auto' (resolve dynamically), 'native' (GitHub-native analysis & SARIF artifact), or 'original' (upstream OpenSSF publish)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - native
          - original
      publish_results:
        description: "Publish results to OpenSSF REST API (requires public repo & OIDC)"
        required: false
        default: false
        type: boolean
      runner:
        description: "Custom runner label (leave empty for vars.RUNNER_LABEL or ubuntu-24.04)"
        required: false
        default: ""
        type: string

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    # Guard push trigger on forks to conserve runner minutes
    if: github.repository == 'k3s-io/k3s' || github.event_name != 'push'
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read

    steps:
      - name: Resolve Execution Mode
        id: mode
        shell: bash
        run: |
          REQUESTED_MODE="${{ inputs.mode || 'auto' }}"
          echo "Requested mode: $REQUESTED_MODE"
          if [ "$REQUESTED_MODE" = "auto" ]; then
            if [ "${{ github.repository }}" = "k3s-io/k3s" ]; then
              RESOLVED_MODE="original"
            else
              RESOLVED_MODE="native"
            fi
          else
            RESOLVED_MODE="$REQUESTED_MODE"
          fi
          echo "resolved_mode=$RESOLVED_MODE" >> "$GITHUB_OUTPUT"
          echo "### OpenSSF Scorecard Execution" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`$RESOLVED_MODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
          publish_results: ${{ (steps.mode.outputs.resolved_mode == 'original' || inputs.publish_results == true) && github.event.repository.visibility == 'public' }}

      - name: "Generate Step Summary"
        if: always()
        shell: bash
        run: |
          if [ -f results.sarif ]; then
            echo "### Scorecard Analysis Results" >> "$GITHUB_STEP_SUMMARY"
            echo "SARIF report generated successfully ($(wc -c < results.sarif) bytes)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Scorecard Analysis" >> "$GITHUB_STEP_SUMMARY"
            echo "No SARIF file generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
          if-no-files-found: warn

      - name: "Upload to code-scanning"
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        continue-on-error: true
        with:
          sarif_file: results.sarif
