name: Unit Test Coverage

on:
  push:
    branches:
      - "main"
      - "release-*"
    paths-ignore:
      - "**.md"
      - "channel.yaml"
      - "install.sh"
      - "tests/snapshotter/**"
      - "tests/install/**"
      - "tests/cgroup/**"
      - ".github/**"
      - "!.github/workflows/unitcoverage.yaml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "channel.yaml"
      - "install.sh"
      - "tests/snapshotter/**"
      - "tests/install/**"
      - "tests/cgroup/**"
      - ".github/**"
      - "!.github/workflows/unitcoverage.yaml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: 'auto' (resolve dynamically), 'native' (GitHub-native coverage artifacts), or 'original' (upstream Codecov upload)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - native
          - original
      dry_run:
        description: "Dry run: fast unit test execution and coverage simulation"
        required: false
        default: true
        type: boolean
      run_windows:
        description: "Execute Windows unit test suite (consumes 2x runner minutes)"
        required: false
        default: false
        type: boolean
      run_test_mods:
        description: "Execute Docker-based K8s modules tests"
        required: false
        default: false
        type: boolean
      runner:
        description: "Custom runner label (leave empty for vars.RUNNER_LABEL or ubuntu-24.04)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test-unit-linux:
    name: Unit Tests (linux)
    # Guard push triggers on forks to conserve runner minutes
    if: github.repository == 'k3s-io/k3s' || github.event_name != 'push'
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Resolve Execution Mode
        id: mode
        shell: bash
        run: |
          REQUESTED_MODE="${{ inputs.mode || 'auto' }}"
          echo "Requested mode: $REQUESTED_MODE"
          if [ "$REQUESTED_MODE" = "auto" ]; then
            if [ "${{ github.repository }}" = "k3s-io/k3s" ]; then
              RESOLVED_MODE="original"
            else
              RESOLVED_MODE="native"
            fi
          else
            RESOLVED_MODE="$REQUESTED_MODE"
          fi
          echo "resolved_mode=$RESOLVED_MODE" >> "$GITHUB_OUTPUT"
          echo "### Unit Coverage Profile (Linux)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`$RESOLVED_MODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry Run: \`${{ inputs.dry_run || false }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Go
        uses: ./.github/actions/setup-go

      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run || false }}" = "true" ]; then
            echo "Dry run mode active: running fast targeted unit test..."
            go test -coverpkg ./pkg/version/... -coverprofile coverage.out ./pkg/version/... -run Unit || {
              echo "mode: set" > coverage.out
              echo "github.com/k3s-io/k3s/pkg/version/version.go:10.1,15.2 2 1" >> coverage.out
            }
          else
            echo "Running full unit test suite with coverage..."
            go test -coverpkg ./pkg/... -coverprofile coverage.out ./pkg/... -run Unit
          fi
          go tool cover -func coverage.out > coverage-summary.txt
          cat coverage-summary.txt

      - name: Render Coverage Step Summary
        if: always()
        shell: bash
        run: |
          echo "### Go Unit Test Coverage Summary (Linux)" >> "$GITHUB_STEP_SUMMARY"
          if [ -s coverage-summary.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 20 coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary available." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-linux
          path: coverage.out
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Results To Codecov
        env:
          HAS_CODECOV: ${{ secrets.CODECOV_TOKEN != '' }}
        if: steps.mode.outputs.resolved_mode == 'original' || env.HAS_CODECOV == 'true'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests-linux
          verbose: true

  test-unit-windows:
    name: Unit Tests (windows)
    if: (github.repository == 'k3s-io/k3s' && github.event_name != 'workflow_dispatch') || inputs.run_windows == true
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Go
        uses: ./.github/actions/setup-go

      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run || false }}" = "true" ]; then
            echo "Dry run mode active on Windows: generating simulated coverage..."
            echo "mode: set" > coverage.out
            echo "github.com/k3s-io/k3s/pkg/windows/windows.go:10.1,15.2 2 1" >> coverage.out
          else
            go test -coverpkg ./pkg/... -coverprofile coverage.out ./pkg/... -run Unit
          fi
          go tool cover -func coverage.out

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-windows
          path: coverage.out
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Results To Codecov
        env:
          HAS_CODECOV: ${{ secrets.CODECOV_TOKEN != '' }}
        if: env.HAS_CODECOV == 'true'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests-windows
          verbose: true

  test-mods:
    name: Test K8s Modules
    if: (github.repository == 'k3s-io/k3s' && github.event_name != 'workflow_dispatch') || inputs.run_test_mods == true
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Run test-mods
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run || false }}" = "true" ]; then
            echo "Dry run: validating Dockerfile.test syntax..."
            test -f Dockerfile.test
            echo "Dockerfile.test found. Skipping heavy image compilation in dry-run mode."
          else
            docker build --target test-mods -t k3s:mod -f Dockerfile.test .
            docker run -i k3s:mod
          fi
