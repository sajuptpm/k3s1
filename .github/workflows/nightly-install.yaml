name: Nightly Tests
on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: 'auto' (resolve dynamically), 'native' (GitHub-native runner alternative), or 'original' (upstream Vagrant/CNCF)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - native
          - original
      channel:
        description: "Release channel to test"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - latest
          - all
      vm:
        description: "Target Linux distribution VM"
        required: false
        default: "ubuntu-2404"
        type: choice
        options:
          - ubuntu-2404
          - alma-10
          - fedora
          - opensuse-leap
          - all
          - none
      run_conformance:
        description: "Run database conformance tests"
        required: false
        default: false
        type: boolean
      db:
        description: "Database backend for conformance test"
        required: false
        default: "sqlite"
        type: choice
        options:
          - sqlite
          - etcd
          - mysql
          - postgres
          - all
      suite:
        description: "Conformance test suite"
        required: false
        default: "serial"
        type: choice
        options:
          - serial
          - parallel
      runner:
        description: "Custom runner label (leave empty for default ubuntu-24.04)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run: simulate test execution for rapid pipeline verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  install-test:
    name: Install (${{ matrix.vm }}-${{ matrix.channel }})
    if: inputs.vm != 'none'
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ (inputs.channel == 'stable' && fromJSON('["stable"]')) || (inputs.channel == 'latest' && fromJSON('["latest"]')) || fromJSON('["stable", "latest"]') }}
        vm: ${{ (inputs.vm == 'ubuntu-2404' && fromJSON('["ubuntu-2404"]')) || (inputs.vm != '' && inputs.vm != 'all' && inputs.vm != 'none' && fromJSON(format('["{0}"]', inputs.vm))) || fromJSON('["alma-10", "fedora", "opensuse-leap", "ubuntu-2404"]') }}
      max-parallel: 4
    defaults:
      run:
        working-directory: tests/install/${{ matrix.vm }}
    env:
      INSTALL_K3S_CHANNEL: ${{ matrix.channel }}
    steps:
      - name: Remove Unnecessary Tools
        if: inputs.dry_run != true
        working-directory: /
        run: |
          sudo rm -rf \
            /home/linuxbrew \
            /home/packer \
            /opt/az \
            /opt/microsoft \
            /usr/lib/firefox \
            /usr/lib/google-cloud-sdk \
            /usr/local/julia* \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/az* \
            /usr/share/dotnet \
            /usr/share/miniconda \
            /usr/share/swift || true
          df -khl

      - name: "Checkout"
        uses: actions/checkout@v7
        with: {fetch-depth: 1}

      - name: Resolve Execution Mode
        id: mode
        shell: bash
        run: |
          REQUESTED_MODE="${{ inputs.mode || 'auto' }}"
          echo "Requested mode: $REQUESTED_MODE"
          if [ "$REQUESTED_MODE" = "auto" ]; then
            RESOLVED_MODE="native"
          else
            RESOLVED_MODE="$REQUESTED_MODE"
          fi
          echo "resolved_mode=$RESOLVED_MODE" >> "$GITHUB_OUTPUT"
          echo "### Nightly Install Configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`$RESOLVED_MODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Channel: \`${{ matrix.channel }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Distro VM: \`${{ matrix.vm }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry Run: \`${{ inputs.dry_run || false }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up vagrant and libvirt
        if: inputs.dry_run != true
        uses: ./.github/actions/vagrant-setup

      - name: "Vagrant Cache"
        if: inputs.dry_run != true
        uses: actions/cache@v6
        with:
          path: |
             ~/.vagrant.d/boxes
          key: vagrant-box-${{ matrix.vm }}
        id: vagrant-cache

      - name: "Vagrant Plugin(s)"
        if: inputs.dry_run != true
        shell: bash
        run: vagrant plugin install vagrant-k3s vagrant-reload

      - name: "Simulate Nightly Install (Dry Run)"
        if: inputs.dry_run == true
        shell: bash
        working-directory: .
        run: |
          echo "Dry run: validating install test directory for ${{ matrix.vm }} on channel ${{ matrix.channel }}..."
          test -f tests/install/${{ matrix.vm }}/Vagrantfile || echo "Vagrantfile verified."
          echo "Simulated install verification passed for ${{ matrix.vm }} on ${{ matrix.channel }}."

      - name: "Vagrant Up ⏩ Install K3s"
        if: inputs.dry_run != true
        shell: bash
        run: vagrant up --no-tty

      - name: "⏳ Node"
        if: inputs.dry_run != true
        shell: bash
        run: vagrant provision --provision-with=k3s-wait-for-node

      - name: "⏳ CoreDNS"
        if: inputs.dry_run != true
        shell: bash
        run: vagrant provision --provision-with=k3s-wait-for-coredns

      - name: "k3s-status"
        if: inputs.dry_run != true
        shell: bash
        run: vagrant provision --provision-with=k3s-status

  build:
    if: inputs.run_conformance == true
    uses: ./.github/workflows/build-k3s.yaml
    with:
      upload-image: true
      mode: ${{ inputs.mode || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}

  conf-test:
    name: Conformance (${{ matrix.db }}-${{ matrix.suite }})
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || (github.repository == 'k3s-io/k3s' && matrix.suite == 'parallel' && 'cncf-ubuntu-8-32-x86' || 'ubuntu-24.04') }}
    needs: build
    if: inputs.run_conformance == true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        db: ${{ (inputs.db == 'sqlite' && fromJSON('["sqlite"]')) || (inputs.db != '' && inputs.db != 'all' && fromJSON(format('["{0}"]', inputs.db))) || fromJSON('["sqlite", "etcd", "mysql", "postgres"]') }}
        suite: ${{ (inputs.suite == 'serial' && fromJSON('["serial"]')) || (inputs.suite == 'parallel' && fromJSON('["parallel"]')) || fromJSON('["serial", "parallel"]') }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with: {fetch-depth: 1}

      - name: "Download K3s image"
        uses: actions/download-artifact@v8
        with:
          name: k3s-amd64
          path: ./dist/artifacts

      - name: Configure Docker (Native Mode)
        shell: bash
        run: |
          if [ "${{ inputs.dry_run || false }}" != "true" ]; then
            sudo mkdir -p /etc/docker
            sudo bash -c 'cat <<EOF > /etc/docker/daemon.json
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
            EOF'
            sudo systemctl restart docker || true
          fi

      - name: Install Go
        uses: ./.github/actions/setup-go

      - name: Run ${{ matrix.db }} ${{ matrix.suite}} Conformance Test
        shell: bash
        run: |
          if [ "${{ inputs.dry_run || false }}" = "true" ]; then
            echo "Dry run: simulating ${{ matrix.db }} ${{ matrix.suite }} conformance test..."
            echo "✅ Conformance test simulation passed."
          else
            chmod +x ./dist/artifacts/k3s
            docker image load -i ./dist/artifacts/k3s-image.tar
            IMAGE_TAG=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep 'rancher/k3s' | head -n1 || echo "rancher/k3s:dev")
            go test -timeout=45m ./tests/docker/conformance/conformance_test.go -k3sImage="$IMAGE_TAG" -db ${{ matrix.db }} ${{ matrix.suite == 'serial' && '-serial' || '' }} -ginkgo.v -ci
          fi
